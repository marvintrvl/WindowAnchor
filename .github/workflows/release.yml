name: Release Build

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Run service-layer tests
        run: dotnet test WindowAnchor.sln --configuration Release

      - name: Build Windows executable
        shell: pwsh
        run: |
          dotnet publish src/WindowAnchor/WindowAnchor.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishReadyToRun=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output ./publish

      - name: Package release assets
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $executable = "./publish/WindowAnchor-$tag.exe"
          $browserConnector = "./publish/WindowAnchor-Browser-Connector-$tag.zip"
          Copy-Item `
            ./publish/WindowAnchor.exe `
            $executable
          Compress-Archive `
            -Path ./browser-extension/* `
            -DestinationPath $browserConnector `
            -CompressionLevel Optimal
          $checksums = @($executable, $browserConnector) | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_).Hash
            "$hash  $(Split-Path -Leaf $_)"
          }
          Set-Content `
            -Path ./publish/SHA256SUMS.txt `
            -Value $checksums `
            -Encoding ascii

      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          gh release upload `
            $tag `
            "./publish/WindowAnchor-$tag.exe" `
            "./publish/WindowAnchor-Browser-Connector-$tag.zip" `
            ./publish/SHA256SUMS.txt `
            --repo "${{ github.repository }}" `
            --clobber
